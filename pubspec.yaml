name: alqalah_edu
description: منصة الأستاذ - نظام إدارة أكاديمي متكامل
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # المصادقة وقاعدة البيانات
  supabase_flutter: ^2.5.0
  # التخزين المحلي (Offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # استيراد وتصدير Excel
  excel: ^4.0.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  # إدارة الحالة
  flutter_riverpod: ^2.5.1
  # التصميم والأيقونات
  phosphor_flutter: ^2.1.0
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0
  # الأمان والقفل
  local_auth: ^2.2.0
  crypto: ^3.0.3
  # الإشعارات
  flutter_local_notifications: ^17.1.2
  # أدوات مساعدة
  intl: ^0.19.0
  uuid: ^4.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

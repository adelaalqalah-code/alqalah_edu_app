name: Build Flutter APK (With Debug Logs)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable

      - name: Flutter Doctor (Check Environment)
        run: flutter doctor -v

      - name: Generate Android Project
        run: |
          rm -rf android
          flutter config --no-analytics
          flutter create . --platforms android --project-name alqalah_edu_app

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK (With Logs)
        run: |
          flutter build apk --debug --verbose 2>&1 | tee build-log.txt
        continue-on-error: true

      - name: Upload Build Logs (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs
          path: build-log.txt

      - name: Upload APK (If Success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alqalah-edu-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

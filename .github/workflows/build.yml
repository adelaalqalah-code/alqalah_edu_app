name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
      
      - name: Backup source files
        run: |
          cp -r lib /tmp/lib-backup
          cp pubspec.yaml /tmp/pubspec-backup.yaml
      
      - name: Create Android project
        run: |
          rm -rf android ios .metadata
          flutter create . --project-name alqalah_edu_app --platforms android
      
      - name: Restore source files
        run: |
          rm -rf lib
          cp -r /tmp/lib-backup lib
          cp /tmp/pubspec-backup.yaml pubspec.yaml
      
      - run: flutter pub get
      
      - run: flutter build apk --debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: alqalah-edu-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
$workflow = @'
name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
      - run: |
          flutter config --no-analytics
          flutter create . --platforms android --project-name alqalah_edu_app
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: alqalah-edu-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
          tag_name: v1.0.0-debug
          name: Alqalah Edu Debug APK
          body: Debug build generated automatically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
'@

Set-Content -Path ".github\workflows\build.yml" -Value $workflow -Encoding UTF8
git add .github/workflows/build.yml
git commit -m "Add auto-release for APK"
git push origin main